name: Compila APK Metronomo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installa Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepara la struttura del progetto
        run: |
          mkdir -p java/it/ignazio/metronomo res/drawable assets
          cp MainActivity.java java/it/ignazio/metronomo/MainActivity.java
          cp ic_launcher.xml res/drawable/ic_launcher.xml
          cp index.html assets/index.html

      - name: Chiave di firma fissa (per aggiornare l'app senza disinstallarla)
        run: |
          mkdir -p ~/.android
          base64 -d chiave-firma.txt > ~/.android/debug.keystore

      - name: Compila
        run: gradle assembleDebug --no-daemon

      - name: Rinomina APK
        run: cp build/outputs/apk/debug/*.apk Metronomo.apk

      - name: Carica APK tra gli artifact
        uses: actions/upload-artifact@v4
        with:
          name: Metronomo
          path: Metronomo.apk

      - name: Pubblica nelle Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Metronomo v1.${{ github.run_number }}
          files: Metronomo.apk
