plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'it.ignazio.metronomo'
    compileSdk 34

    defaultConfig {
        applicationId 'it.ignazio.metronomo'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Struttura semplice: tutti i file sono nella cartella principale del repo
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['java']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
